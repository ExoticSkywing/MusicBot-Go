broadcast_cmd = "更新のお知らせを一斉送信（管理者）"
help_admincmd_broadcast = "お知らせをプレビューして送信を確認：/broadcast 本文（管理者の個人チャットのみ）"
broadcast_setting_title = "更新のお知らせを受け取る"
broadcast_setting_desc = "管理者が手動送信するお知らせを受け取ります。オフにしても音楽機能に影響しません"
broadcast_private_only = "ボット管理者として個人チャットで一斉送信を利用してください。"
broadcast_usage = "📣 更新のお知らせ\n\n/broadcast 本文 を送信し、プレビュー後に「送信を確定」を選んでください。改行を含むプレーンテキストで最大 3000 文字（一部の絵文字は 2 文字）です。\n\n記録済みの個人チャットで通知がオン、かつ許可リスト対象の一般ユーザーに送信します。新しいプレビューは以前のものを置き換え、有効期限は 10 分です。\n/broadcast cancel で自分のプレビューの取消や送信の停止ができます。更新・再起動による自動送信はありません。"
broadcast_too_long = "本文を 3000 文字以内（一部の絵文字は 2 文字）に短くして、再度プレビューしてください。"
broadcast_unavailable = "一斉送信の準備ができません。後ほど /broadcast 本文 をお試しください。"
broadcast_empty = "送信対象がいません。この機能の導入後、個人チャットで再び操作したユーザーから記録します。通知オフ、到達不能、管理者、許可リスト対象外のユーザーは除外します。"
broadcast_busy = "別の一斉送信が進行中です。終了後に再度プレビューしてください。送信者は /broadcast cancel で停止できます。"
broadcast_preview = "📣 一斉送信プレビュー · 未送信\n送信予定：{{.Count}} 人（管理者以外の個人チャット）\n\n—— お知らせ本文 ——\n{{.Text}}\n—— 本文終了 ——\n\n確定後、上記の本文だけを送信します。有効期限は 10 分です。送信前に通知設定と許可リストを再確認します。"
broadcast_confirm = "送信を確定"
broadcast_cancel = "プレビューを取り消す"
broadcast_stop = "送信を停止"
broadcast_expired = "このプレビューは期限切れ、処理済み、または別の管理者のものです。/broadcast で作り直してください。"
broadcast_cancelled = "プレビューを取り消しました。本文は送信されません。他の管理者の進行中の送信には影響しません。"
broadcast_stopping = "停止を要求しました。送信済みのメッセージは撤回できません。処理中のリクエストは届く場合があります。結果をお待ちください。"
broadcast_sending = "📣 一斉送信中\n今回の対象：{{.Count}} 人\n\n以降の送信を停止できます。送信済みのメッセージは残ります。"
broadcast_finished = "📣 一斉送信が終了しました\n\n成功：{{.Sent}} 人\n失敗または結果未確認：{{.Failed}} 人\nスキップ：{{.Skipped}} 人\n未処理：{{.Remaining}} 人\n\n通知オフ、到達不能、権限変更の場合はスキップします。重複を避けるため失敗分は自動再送しません。"
broadcast_stopped = "📣 一斉送信を停止しました\n\n成功：{{.Sent}} 人\n失敗または結果未確認：{{.Failed}} 人\nスキップ：{{.Skipped}} 人\n未処理：{{.Remaining}} 人\n\n取消、権限変更、サービス異常などで停止しました。自動再開はせず、送信済みのメッセージは残ります。"
