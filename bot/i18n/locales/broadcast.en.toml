broadcast_cmd = "Send an update broadcast (admin)"
help_admincmd_broadcast = "Preview and confirm an update broadcast: /broadcast announcement (admin private chat only)"
broadcast_setting_title = "Receive update announcements"
broadcast_setting_desc = "Receive announcements manually sent by administrators; turning this off does not affect music features"
broadcast_private_only = "Use broadcasts in a private chat as a bot administrator."
broadcast_usage = "📣 Update broadcast\n\nSend /broadcast announcement, review the preview, then select Confirm send. Multi-line plain text is supported, up to 3000 characters (some emoji count as 2).\n\nRecipients are recorded private-chat users with notifications enabled and whitelist access, excluding administrators. A new preview replaces your previous one and expires in 10 minutes.\nUse /broadcast cancel to discard your preview or stop your broadcast. Updates and restarts never send broadcasts automatically."
broadcast_too_long = "Shorten the announcement to 3000 characters (some emoji count as 2), then preview it again."
broadcast_unavailable = "Unable to prepare the broadcast. Try /broadcast announcement again later."
broadcast_empty = "No eligible recipients yet. Private chats are recorded from feature launch; returning users are added when they interact privately again. Opted-out, unreachable, administrator and non-whitelisted users are excluded."
broadcast_busy = "A broadcast is already running. Wait for it to finish, then create a new preview. Its sender can stop it with /broadcast cancel."
broadcast_preview = "📣 Broadcast preview · Not sent\nExpected recipients: {{.Count}} non-admin private-chat users\n\n—— Announcement ——\n{{.Text}}\n—— End of announcement ——\n\nOnly the announcement text will be sent after confirmation. Preview expires in 10 minutes; notifications and whitelist access are checked again before delivery."
broadcast_confirm = "Confirm send"
broadcast_cancel = "Cancel preview"
broadcast_stop = "Stop sending"
broadcast_expired = "This preview has expired, was already handled, or belongs to another administrator. Create a new one with /broadcast."
broadcast_cancelled = "Preview cancelled; its announcement will not be sent. Other administrators' active broadcasts are unaffected."
broadcast_stopping = "Stop requested. Delivered messages cannot be recalled; an in-flight request may still arrive. Results will follow."
broadcast_sending = "📣 Sending broadcast\nRecipient snapshot: {{.Count}} users\n\nYou can stop further deliveries. Already delivered messages will remain."
broadcast_finished = "📣 Broadcast finished\n\nSent: {{.Sent}}\nFailed or unconfirmed: {{.Failed}}\nSkipped: {{.Skipped}}\nUnprocessed: {{.Remaining}}\n\nSkipped includes opted-out, unreachable or no longer eligible users. Failures are not automatically resent to avoid duplicates."
broadcast_stopped = "📣 Broadcast stopped\n\nSent: {{.Sent}}\nFailed or unconfirmed: {{.Failed}}\nSkipped: {{.Skipped}}\nUnprocessed: {{.Remaining}}\n\nStopped due to cancellation, a permission change or a service issue. No automatic resume; delivered messages remain."
