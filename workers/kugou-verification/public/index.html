<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="referrer" content="no-referrer">
  <meta name="robots" content="noindex,nofollow">
  <title>酷狗验证 · MusicBot</title>
  <link rel="stylesheet" href="/style.css">
  <script src="/client.js" defer></script>
</head>
<body>
  <main>
    <div class="brand"><span class="mark" aria-hidden="true">♫</span> MusicBot</div>
    <p id="mode-label" class="eyebrow">酷狗音乐 · 安全验证</p>
    <h1 id="headline">完成验证，<br>继续听歌。</h1>
    <p id="intro" class="intro">请打开官方验证码，手动完成拼图。验证通过后，返回 Bot 重新发送刚才的音乐请求。</p>
    <div class="status" role="status" aria-live="polite"><span id="indicator" aria-hidden="true"></span><span id="state">正在检查验证链接…</span></div>
    <button id="start" disabled>正在准备…<span aria-hidden="true">↗</span></button>
    <p id="expiry" class="expiry"></p>
    <div class="privacy"><span aria-hidden="true">◇</span><p>无需登录或填写账号信息。<br>此页面不会显示酷狗账号或登录凭据。</p></div>
  </main>
  <footer>MusicBot · 验证链接仅短期有效</footer>
</body>
</html>
